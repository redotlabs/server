# Public runtime contract: all credentials must be injected at runtime.
# Activate homelab (which groups prod) instead of changing the existing prod profile.
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      base-url: ${OAUTH2_BASE_URL:https://redot-api.dhxxn.kr}
      client:
        registration:
          redot-member-google:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope: ${GOOGLE_SCOPES:openid,profile,email}
jwt:
  secret: ${JWT_SECRET}
  cookie:
    secure: true
    domain: ${JWT_COOKIE_DOMAIN:redot-api.dhxxn.kr}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
cloud:
  aws:
    region:
      static: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: ${S3_BUCKET}
image:
  cdn-base-url: ${IMAGE_CDN_BASE_URL:}
  upload:
    max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:5242880}
    allowed-content-types: ${IMAGE_ALLOWED_CONTENT_TYPES:image/*}
email:
  verification:
    from-address: ${MAIL_FROM}
    brand-name: ${MAIL_BRAND_NAME:Redot}
    code-length: ${EMAIL_CODE_LENGTH:6}
    code-ttl-seconds: ${EMAIL_CODE_TTL_SECONDS:300}
    token-ttl-seconds: ${EMAIL_TOKEN_TTL_SECONDS:900}
    resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:5}
auth:
  flows:
    redot-member:
      default-success-redirect: ${AUTH_SUCCESS_REDIRECT}
      default-failure-redirect: ${AUTH_FAILURE_REDIRECT}
      allowed-redirect-hosts: ${AUTH_ALLOWED_REDIRECT_HOSTS}
notifications:
  consultation:
    admin-console-base-url: ${ADMIN_CONSOLE_BASE_URL:}
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL:}
redot:
  health:
    public-enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    mail:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
