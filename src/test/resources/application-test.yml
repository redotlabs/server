# Local test values only. No production credentials or network services are needed to load the context.
spring:
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: 127.0.0.1
      port: 1
  mail:
    host: 127.0.0.1
    port: 1
  security:
    oauth2:
      base-url: http://localhost
      client:
        registration:
          test:
            client-id: test-client
            client-secret: test-only
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope: profile
        provider:
          test:
            authorization-uri: http://127.0.0.1:1/authorize
            token-uri: http://127.0.0.1:1/token
            user-info-uri: http://127.0.0.1:1/userinfo
            user-name-attribute: id
jwt:
  secret: test-only-secret-key-with-at-least-32-characters-for-hmac
cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: test-only
      secret-key: test-only
    s3:
      bucket: test-only
