name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test with disposable PostgreSQL
        run: ./gradlew clean build
      - name: Homelab application and runtime validation
        run: python3 scripts/test-kubernetes.py
      - name: Verify packaged configuration allowlist
        run: python3 scripts/check-kubernetes-jar.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
