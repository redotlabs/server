plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'redot'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // OAuth2 의존성
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Redis 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Mail 의존성
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // DB 의존성
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    // Security 의존성
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT 의존성
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    //S3 의존성
    implementation platform('software.amazon.awssdk:bom:2.25.12')
    implementation 'software.amazon.awssdk:s3'

    // Swagger 의존성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.10'

    // Querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:junit-jupiter:1.20.1"
    testImplementation "org.testcontainers:postgresql:1.20.1"
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Run full application/Flyway tests against isolated PostgreSQL and Redis'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.named('test')
}


// Kubernetes packaging is separate from legacy prod/dev workflows.
// Only reviewed, credential-free configuration and migrations enter this image.
def kubernetesResources = tasks.register('kubernetesResources', Sync) {
    from('src/main/resources') {
        include 'application.yml', 'application-homelab.yml', 'db/migration/*.sql'
    }
    into layout.buildDirectory.dir('kubernetes-resources')
}

tasks.register('kubernetesBootJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Build an environment-independent JAR without legacy injected profile files'
    dependsOn tasks.named('classes'), kubernetesResources
    archiveFileName = 'app.jar'
    destinationDirectory = layout.buildDirectory.dir('kubernetes')
    mainClass = 'redot.redot_server.RedotServerApplication'
    targetJavaVersion = JavaVersion.VERSION_21
    classpath = sourceSets.main.runtimeClasspath.filter {
        it != sourceSets.main.output.resourcesDir
    } + files(kubernetesResources.map { it.destinationDir })
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
